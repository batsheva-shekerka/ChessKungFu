# KungFu Chess — split stack (Docker Compose)
#
# Services:
#   api-gateway     — HTTP login / history / room lookup (host 18088)
#   ws-gateway      — thin WebSocket edge (client port 8765)
#   game-server-1/2 — authoritative GameEngine shards
#   matchmaker      — Redis queue matching + Game Allocator
#   redis / postgres
#
# Health / metrics (host):
#   api-gateway   http://localhost:18088/health | /metrics
#   ws-gateway    http://localhost:18080/health | /metrics
#   matchmaker    http://localhost:18081/health | /metrics
#   game-server-1 http://localhost:18082/health | /metrics
#   game-server-2 http://localhost:18083/health | /metrics
#
# Clients:
#   HTTP login  -> http://localhost:18088/api/login
#   WebSocket   -> ws://localhost:8765
#
# Usage:
#   docker compose up --build
#   docker compose down

x-app-healthcheck: &app_healthcheck
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
    ]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

x-api-healthcheck: &api_healthcheck
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2)",
    ]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
      POSTGRES_DB: kungfu_chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  game-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: kungfu-chess-server:local
    command: ["python", "-u", "game_main.py"]
    environment:
      SERVICE_ROLE: game
      SHARD_ID: game-server-1
      HEALTH_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
    ports:
      - "18082:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *app_healthcheck
    restart: unless-stopped

  game-server-2:
    image: kungfu-chess-server:local
    command: ["python", "-u", "game_main.py"]
    environment:
      SERVICE_ROLE: game
      SHARD_ID: game-server-2
      HEALTH_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
    ports:
      - "18083:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      game-server-1:
        condition: service_started
    healthcheck: *app_healthcheck
    restart: unless-stopped

  api-gateway:
    image: kungfu-chess-server:local
    command: ["python", "-u", "api_main.py"]
    environment:
      SERVICE_ROLE: api
      HOST: "0.0.0.0"
      API_PORT: "8088"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
    ports:
      - "18088:8088"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *api_healthcheck
    restart: unless-stopped

  ws-gateway:
    image: kungfu-chess-server:local
    command: ["python", "-u", "gateway_main.py"]
    environment:
      SERVICE_ROLE: gateway
      HOST: "0.0.0.0"
      PORT: "8765"
      HEALTH_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
      GAME_SHARDS: "game-server-1,game-server-2"
    ports:
      - "8765:8765"
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      game-server-1:
        condition: service_healthy
      game-server-2:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck: *app_healthcheck
    restart: unless-stopped

  matchmaker:
    image: kungfu-chess-server:local
    command: ["python", "-u", "matchmaker_main.py"]
    environment:
      SERVICE_ROLE: matchmaker
      HEALTH_PORT: "8080"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
      GAME_SHARDS: "game-server-1,game-server-2"
    ports:
      - "18081:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      game-server-1:
        condition: service_healthy
      game-server-2:
        condition: service_healthy
    healthcheck: *app_healthcheck
    restart: unless-stopped

volumes:
  postgres_data:
