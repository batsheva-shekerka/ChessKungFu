# KungFu Chess — split stack (Docker Compose)
#
# Services:
#   ws-gateway  — WebSocket edge + auth + game engine (client port 8765)
#   matchmaker  — Redis queue matching + Game Allocator
#   redis / postgres
#
# Usage:
#   docker compose up --build
#   docker compose down
#
# Clients connect to: ws://localhost:8765

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
      POSTGRES_DB: kungfu_chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ws-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: kungfu-chess-server:local
    environment:
      SERVICE_ROLE: gateway
      HOST: "0.0.0.0"
      PORT: "8765"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
      GAME_SHARDS: "ws-gateway"
    ports:
      - "8765:8765"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  matchmaker:
    image: kungfu-chess-server:local
    command: ["python", "-u", "matchmaker_main.py"]
    environment:
      SERVICE_ROLE: matchmaker
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://kungfu:kungfu@postgres:5432/kungfu_chess"
      GAME_SHARDS: "ws-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ws-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
